<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NAKA Title Designer Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="group">
      <button id="btnAddText" title="テキストを追加">＋ テキスト</button>
      <button id="btnDupObj" title="選択中のテキストを複製">複製</button>
      <button id="btnDelObj" title="選択中のテキストを削除">削除</button>
    </div>
    <div class="group">
      <button id="btnUndo" title="元に戻す (Ctrl+Z)">↶</button>
      <button id="btnRedo" title="やり直し (Ctrl+Y)">↷</button>
    </div>
    <div class="group">
      <button data-align="h" title="左右中央に揃える">左右中央</button>
      <button data-align="v" title="上下中央に揃える">上下中央</button>
      <button data-align="lower" title="下 1/3 に置く">下テロップ位置</button>
    </div>
    <div class="group">
      <label class="toggle"><input type="checkbox" id="chkBg" checked> 背景</label>
      <label class="toggle"><input type="checkbox" id="chkSafe" checked> セーフエリア</label>
    </div>
    <div class="group grow">
      <button id="btnPlay" title="再生 / 停止 (Space)">▶</button>
      <input type="range" id="frameSlider" min="0" max="149" value="0">
      <span id="frameLabel" class="mono">0 f</span>
    </div>
    <div class="group">
      <button id="btnCancel">キャンセル</button>
      <button id="btnSave" class="primary" title="保存して閉じる (Ctrl+S)">保存して閉じる</button>
    </div>
  </header>

  <div id="main">
    <nav id="tools">
      <button class="tool active" data-tool="select" title="選択ツール (V)">↖</button>
      <button class="tool" data-tool="text" title="テキストツール: クリックした位置に追加 (T)">T</button>
    </nav>

    <section id="stageWrap">
      <div id="stage">
        <canvas id="view"></canvas>
      </div>
      <div id="status">
        <span id="statusLeft"></span>
        <span class="grow"></span>
        <span id="statusRight" class="dim"></span>
        <span id="zoomBar">
          <button id="btnZoomOut" class="small" title="縮小 (Ctrl+-)">−</button>
          <button id="zoomLabel" class="small mono" title="100% に戻す (Ctrl+1)">100%</button>
          <button id="btnZoomIn" class="small" title="拡大 (Ctrl++)">＋</button>
          <button id="btnFit" class="small" title="全体表示 (Ctrl+0)">全体表示</button>
        </span>
      </div>
    </section>

    <div id="splitV" class="splitter v" title="ドラッグでパネルの幅を変更（ダブルクリックで元に戻す）"></div>
    <aside id="props"></aside>
  </div>

  <div id="splitH" class="splitter h" title="ドラッグでスタイル欄の高さを変更（ダブルクリックで元に戻す）"></div>

  <footer id="styles">
    <div class="tabs">
      <button class="tab active" data-tab="style">スタイル</button>
      <button class="tab" data-tab="title">テロップ全体</button>
      <span class="grow"></span>
      <label class="toggle" id="keepFontBox" title="スタイルを適用するとき、選択中のテキストのフォント（書体・太さ・斜体・字間）はそのままにして、色・フチ・影などだけ変える"><input type="checkbox" id="chkKeepFont"> フォントを維持して適用</label>
      <button id="btnSavePreset">現在の設定を保存</button>
    </div>
    <div id="folderBar"></div>
    <div id="presetList"></div>
  </footer>
</div>

<div id="dialog" hidden>
  <div class="box">
    <div id="dialogText"></div>
    <input id="dialogInput" type="text">
    <div class="buttons">
      <button id="dialogCancel">キャンセル</button>
      <button id="dialogOk" class="primary">OK</button>
    </div>
  </div>
</div>

<script src="samples.js"></script>
<script src="app.js"></script>
</body>
</html>
